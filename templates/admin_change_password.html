{% extends "base.html" %}
{% block title %}تغيير كلمة المرور - حقنا{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 2rem auto;">
    <h1 style="font-size: 1.4rem; color: var(--primary-dark); margin-bottom: 1.5rem;">تغيير كلمة المرور</h1>
    <div class="card" style="padding: 1.5rem;">
        <form method="POST">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>كلمة المرور الحالية</label>
                <input type="password" name="current_password" required style="width: 100%;">
            </div>
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>كلمة المرور الجديدة</label>
                <input type="password" name="new_password" required minlength="6" style="width: 100%;">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label>تأكيد كلمة المرور الجديدة</label>
                <input type="password" name="confirm_password" required minlength="6" style="width: 100%;">
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button type="submit" class="btn btn-primary">حفظ</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
