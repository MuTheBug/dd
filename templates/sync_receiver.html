<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حقنا - جسر المزامنة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Arabic',sans-serif;background:#1e293b;color:#e2e8f0;padding:1rem;font-size:0.85rem;direction:rtl}
#status{text-align:center;padding:0.5rem;font-weight:700;font-size:0.95rem}
#log{margin-top:0.5rem;max-height:200px;overflow-y:auto;font-size:0.78rem;direction:ltr;text-align:left}
.ok{color:#34d399} .err{color:#f87171} .info{color:#60a5fa}
</style>
</head>
<body>
<div id="status" class="info">جسر المزامنة — جاهز</div>
<div id="log"></div>
<script>
function base64ToBlob(dataUrl) {
    var parts = dataUrl.split(',');
    var mime = parts[0].match(/:(.*?);/)[1];
    var raw = atob(parts[1]);
    var arr = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return new Blob([arr], { type: mime });
}

function log(msg, cls) {
    var el = document.getElementById('log');
    el.innerHTML += '<div class="' + (cls||'info') + '">' + msg + '</div>';
    el.scrollTop = el.scrollHeight;
}

function reply(data) {
    var target = window.parent !== window ? window.parent : window.opener;
    if (target) target.postMessage(data, '*');
}

reply({ type: 'sync-bridge-ready' });
log('Bridge ready, waiting for entries...', 'info');

window.addEventListener('message', async function(event) {
    var msg = event.data;
    if (!msg) return;

    if (msg.type === 'sync-ping') {
        reply({ type: 'sync-pong' });
        return;
    }

    if (msg.type === 'sync-test-connection') {
        var creds = msg.credentials || {};
        try {
            var pingResp = await fetch('/api/sync/ping', { cache: 'no-store' });
            var pingData = await pingResp.json();
            if (!pingData.ok) {
                reply({ type: 'sync-test-result', success: false, error: 'not_haqquna' });
                return;
            }
            if (creds.user && creds.pass) {
                var loginResp = await fetch('/api/sync/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Sync-User': creds.user, 'X-Sync-Pass': creds.pass }
                });
                var loginData = await loginResp.json();
                reply({ type: 'sync-test-result', success: loginData.success, loginData: loginData, error: loginData.error });
            } else {
                reply({ type: 'sync-test-result', success: true, pingOnly: true, version: pingData.version });
            }
        } catch (e) {
            reply({ type: 'sync-test-result', success: false, error: e.message });
        }
        return;
    }

    if (msg.type !== 'sync-start') return;

    var entries = msg.entries || [];
    var creds = msg.credentials || {};
    document.getElementById('status').textContent = 'جارٍ المزامنة... 0/' + entries.length;
    log('Starting sync of ' + entries.length + ' entries', 'info');

    for (var idx = 0; idx < entries.length; idx++) {
        var entry = entries[idx];
        document.getElementById('status').textContent = 'مزامنة ' + (idx+1) + '/' + entries.length + ' — ' + entry.display_name;

        try {
            var fd = new FormData();
            fd.append('client_uuid', entry.client_uuid);

            var f = entry.fields;
            Object.keys(f).forEach(function(key) {
                if (key.startsWith('_')) return;
                if (key === 'chronic_list') return;
                fd.append(key, f[key] || '');
            });

            if (f._chronic_list && f._chronic_list.length) {
                f._chronic_list.forEach(function(v) { fd.append('chronic_list', v); });
            }

            if (f._companions && f._companions.length) {
                fd.set('companions_count', String(f._companions.length));
                f._companions.forEach(function(c, ci) {
                    fd.append('comp_first_' + ci, c.first_name || '');
                    fd.append('comp_father_' + ci, c.father_name || '');
                    fd.append('comp_last_' + ci, c.last_name || '');
                    fd.append('comp_mother_' + ci, c.mother_name || '');
                    fd.append('comp_notes_' + ci, c.notes || '');
                });
            }

            if (f._extra_docs && f._extra_docs.length) {
                fd.set('record_doc_count', String(f._extra_docs.length));
                f._extra_docs.forEach(function(d, di) {
                    fd.append('record_doc_type_' + di, d.doc_type || '');
                    fd.append('record_doc_date_' + di, d.doc_date || '');
                    fd.append('record_doc_url_' + di, d.doc_url || '');
                    fd.append('record_doc_desc_' + di, d.doc_desc || '');
                });
            }

            if (f._methodology_tags && f._methodology_tags.length) {
                var existingNotes = f.methodology_notes || '';
                var tagsStr = '[وسوم: ' + f._methodology_tags.join('، ') + ']';
                fd.set('methodology_notes', tagsStr + (existingNotes ? '\n' + existingNotes : ''));
            }

            var files = entry.files || {};
            Object.keys(files).forEach(function(fname) {
                var fileInfo = files[fname];
                if (fileInfo && fileInfo.data) {
                    var blob = base64ToBlob(fileInfo.data);
                    fd.append(fname, blob, fileInfo.name || (fname + '.jpg'));
                }
            });

            var resp = await fetch('/api/sync/entries', {
                method: 'POST', body: fd,
                headers: { 'X-Sync-User': creds.user, 'X-Sync-Pass': creds.pass }
            });
            var data = await resp.json();

            if (data.success) {
                log('✓ ' + entry.display_name + ' → #' + data.server_id, 'ok');
                reply({ type: 'sync-entry-result', uuid: entry.client_uuid, success: true, server_id: data.server_id, duplicate: !!data.duplicate_uuid });
            } else {
                var errMsg = (data.errors || [data.error]).join(', ');
                log('✗ ' + entry.display_name + ': ' + errMsg, 'err');
                reply({ type: 'sync-entry-result', uuid: entry.client_uuid, success: false, error: errMsg });
            }
        } catch (e) {
            log('✗ ' + entry.display_name + ': ' + e.message, 'err');
            reply({ type: 'sync-entry-result', uuid: entry.client_uuid, success: false, error: e.message });
        }
    }

    document.getElementById('status').textContent = 'اكتملت المزامنة';
    reply({ type: 'sync-complete' });
});
</script>
</body>
</html>
